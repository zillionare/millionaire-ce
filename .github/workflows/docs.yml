name: Documentation

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure temporary artifacts
        run: python -m scripts.artifact_paths --github-env

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mkdocs>=1.2.3,<2.0.0" \
            "mkdocs-material>=8.1.11,<10.0.0"

      - name: Build documentation
        run: mkdocs build --strict --site-dir "${{ env.MILLIONAIRE_ARTIFACTS_DIR }}/site"

      - name: Verify documentation is self-contained
        run: |
          if grep -R -E "fonts\.googleapis\.com|fonts\.gstatic\.com" \
            "${{ env.MILLIONAIRE_ARTIFACTS_DIR }}/site"; then
            echo "Documentation must not depend on external font hosts" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.MILLIONAIRE_ARTIFACTS_DIR }}/site
      - name: Verify clean checkout layout
        run: python -m scripts.artifact_paths --check-layout

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
