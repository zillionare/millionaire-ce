name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  live-data:
    uses: ./.github/workflows/live-data.yml
    with:
      required: true
    secrets:
      TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}

  publish:
    name: publish
    needs: [ci, live-data]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require tag and package version to match
        shell: python
        run: |
          import os, pathlib, sys, tomllib
          metadata = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          expected = 'v' + metadata['tool']['poetry']['version']
          if os.environ['GITHUB_REF_NAME'] != expected:
              sys.exit(f'Release tag must be {expected}')
      - name: Download the exact package tested by CI
        uses: actions/download-artifact@v4
        with:
          name: package-ubuntu-latest
          path: dist
      - name: Download verified native installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: dist/installers
          merge-multiple: true
      - name: Revalidate the tested artifacts
        run: python scripts/validate_release_artifacts.py dist
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/installers/*
          fail_on_unmatched_files: true
      - name: Isolate Python distributions for PyPI
        shell: python
        run: |
          import pathlib, shutil
          target = pathlib.Path('pypi-dist')
          target.mkdir()
          for path in pathlib.Path('dist').iterdir():
              if path.is_file() and (path.suffix == '.whl' or path.name.endswith('.tar.gz')):
                  shutil.copy2(path, target)
      - name: Publish to PyPI when configured
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
          packages-dir: pypi-dist
